[package]
name = "gw"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
# Keep client key order: re-serialized bodies must not change cached prefixes.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util", "sync"] }
toml = "0.8"
# Edits user TOML (codex config) without dropping comments.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Small binary and low RAM matter more than peak CPU for an I/O-bound proxy.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

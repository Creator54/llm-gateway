name: llm-gateway

services:
  hub:
    image: ${OCX_IMAGE:?Run just build first}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ocx-state:/home/bun/.opencodex
      - codex-state:/home/bun/.codex
      - opencode-state:/home/bun/.local
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/bun/.cache:mode=1777
      - /home/bun/.config:mode=1777
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [gateway]

  headroom:
    image: ${HEADROOM_IMAGE:?Run just build first}
    command: [--host, 0.0.0.0, --port, '8787', --openai-api-url, 'http://hub:10100']
    environment:
      HEADROOM_BEACON: 'off'
      DO_NOT_TRACK: '1'
      # The host port is loopback-only; hub enforces client authentication.
      HEADROOM_ALLOW_UNAUTHENTICATED_BIND: '1'
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-10204}:8787'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [gateway]

networks:
  gateway:

volumes:
  ocx-state:
    name: ${OCX_STATE_VOLUME:-${COMPOSE_PROJECT_NAME}_ocx-state}
  codex-state:
    name: ${CODEX_STATE_VOLUME:-${COMPOSE_PROJECT_NAME}_codex-state}
  opencode-state:
    name: ${OPENCODE_STATE_VOLUME:-${COMPOSE_PROJECT_NAME}_opencode-state}
